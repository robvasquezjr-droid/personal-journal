<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2667c9" id="themeColorMeta">
<title>Journal</title>
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem('personal-journal-theme') || 'ocean'; }
  catch (e) { document.documentElement.dataset.theme = 'ocean'; }
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f6f4;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --muted: #676d78;
    --border: #e5e2de;
    --danger: #d1453b;
    --overlay: rgba(20, 22, 26, 0.55);
    --on-accent: #ffffff;
    --header-shade: 10%;
    --shadow: 0 1px 2px rgba(20, 20, 30, 0.05), 0 6px 18px rgba(20, 20, 30, 0.06);
    --shadow-hover: 0 2px 4px rgba(20, 20, 30, 0.07), 0 12px 28px rgba(20, 20, 30, 0.11);
    --accent: #2667c9;
    --accent-2: #129e94;
    --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--card-bg));
    --page-bg: color-mix(in srgb, var(--accent) 5%, var(--bg));
  }
  :root[data-theme="sunset"]   { --accent: #d9482f; --accent-2: #e57c2f; }
  :root[data-theme="forest"]   { --accent: #2a7f4d; --accent-2: #5f9a2e; }
  :root[data-theme="lavender"] { --accent: #6d4fd6; --accent-2: #c9458a; }
  :root[data-theme="classic"]  { --accent: #3b6ef6; --accent-2: #5b7ff5; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131519;
      --card-bg: #1d2025;
      --text: #eaecef;
      --muted: #9aa0aa;
      --border: #2d3139;
      --overlay: rgba(0, 0, 0, 0.72);
      --on-accent: #0f1115;
      --header-shade: 45%;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, 0.35), 0 12px 28px rgba(0, 0, 0, 0.35);
      --accent: #5b9cf0;
      --accent-2: #3cc9bd;
    }
    :root[data-theme="sunset"]   { --accent: #ff7d62; --accent-2: #ffa15a; }
    :root[data-theme="forest"]   { --accent: #56c47f; --accent-2: #9ccf5a; }
    :root[data-theme="lavender"] { --accent: #a58bff; --accent-2: #f07ab5; }
    :root[data-theme="classic"]  { --accent: #7a9cff; --accent-2: #93acff; }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1100px 380px at 50% -140px, color-mix(in srgb, var(--accent-2) 16%, transparent), transparent),
      var(--page-bg);
    background-repeat: no-repeat;
    min-height: 100vh;
    color: var(--text);
  }

  /* Header */
  header {
    padding: 16px 20px;
    background: linear-gradient(120deg,
      color-mix(in srgb, var(--accent), #000 var(--header-shade)),
      color-mix(in srgb, var(--accent-2), #000 var(--header-shade)));
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { font-size: 1.35rem; margin: 0; letter-spacing: 0.01em; }
  .header-date { font-size: 0.8rem; opacity: 0.92; margin-top: 2px; }
  #fileControls {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: rgba(255, 255, 255, 0.92);
  }
  button.header-btn {
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.38);
    color: #fff;
    text-shadow: inherit;
  }
  button.header-btn:hover { background: rgba(255, 255, 255, 0.26); border-color: rgba(255, 255, 255, 0.6); }
  .theme-wrap { position: relative; }
  .theme-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    min-width: 190px;
    background: var(--card-bg);
    color: var(--text);
    text-shadow: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-hover);
    padding: 6px;
    z-index: 60;
  }
  .theme-menu[hidden] { display: none; }
  .theme-menu-title { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 8px 4px; }
  button.theme-option {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    border: none; background: none;
    padding: 7px 8px; border-radius: 8px;
  }
  button.theme-option:hover { background: var(--accent-soft); }
  button.theme-option.active { font-weight: 600; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }

  /* Buttons & inputs */
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    transition: background 0.15s, border-color 0.15s, filter 0.15s;
  }
  button:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.07); }
  button.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #banner {
    display: none;
    background: color-mix(in srgb, #f5b301 16%, var(--card-bg));
    color: var(--text);
    border-bottom: 1px solid color-mix(in srgb, #f5b301 35%, var(--border));
    padding: 8px 20px;
    font-size: 0.82rem;
  }

  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Toolbar & search */
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; opacity: 0.6; pointer-events: none; }
  .search-wrap input {
    flex: 1;
    min-width: 0;
    font: inherit;
    padding: 9px 8px 9px 34px;
    border: none;
    background: transparent;
    color: var(--text);
    outline: none;
  }
  .search-wrap select {
    font: inherit;
    font-size: 0.8rem;
    border: none;
    border-left: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    padding: 0 8px;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
  }
  .view-toggle {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .view-toggle button { border: none; border-radius: 7px; background: transparent; padding: 6px 12px; }
  .view-toggle button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .search-status { font-size: 0.8rem; color: var(--muted); margin: -4px 0 14px; }
  .search-status strong { color: var(--text); }

  /* On this day */
  #onThisDay {
    display: none;
    background: linear-gradient(120deg,
      color-mix(in srgb, var(--accent) 12%, var(--card-bg)),
      color-mix(in srgb, var(--accent-2) 12%, var(--card-bg)));
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .otd-title { font-weight: 700; font-size: 0.75rem; margin-bottom: 4px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
  button.otd-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 6px 0;
    color: var(--text);
    font-size: 0.9rem;
  }
  button.otd-item:hover { color: var(--accent); }

  /* Timeline */
  .month-header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 22px 0 10px;
  }
  .month-header::after { content: ''; flex: 1; height: 1px; background: color-mix(in srgb, var(--accent) 28%, transparent); }
  .month-header:first-child { margin-top: 0; }

  .entry-card {
    --card-accent: var(--accent);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 5px solid var(--card-accent);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .entry-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
  .date-badge {
    flex-shrink: 0;
    width: 52px;
    padding: 6px 0;
    border-radius: 10px;
    text-align: center;
    line-height: 1.1;
    background: color-mix(in srgb, var(--card-accent) 15%, var(--card-bg));
    color: color-mix(in srgb, var(--card-accent) 72%, var(--text));
  }
  .db-day { display: block; font-size: 1.35rem; font-weight: 700; }
  .db-wd { display: block; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .entry-main { flex: 1; min-width: 0; }
  .entry-title { font-weight: 650; font-size: 1.02rem; margin-bottom: 3px; }
  .entry-snippet {
    font-size: 0.86rem;
    line-height: 1.45;
    color: color-mix(in srgb, var(--text) 82%, var(--card-bg));
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.76rem;
    line-height: 1.2;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--text);
    border: 1px solid transparent;
    text-decoration: none;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chip.mood { background: color-mix(in srgb, var(--chip-color) 18%, var(--card-bg)); border-color: color-mix(in srgb, var(--chip-color) 35%, transparent); }
  .chip.weather { background: color-mix(in srgb, var(--accent-2) 14%, var(--card-bg)); }
  a.chip:hover { border-color: var(--accent); }
  .thumb-strip { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  img.thumb {
    width: 64px; height: 64px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); cursor: pointer;
  }
  .thumb-more {
    width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem; background: var(--bg);
  }
  .entry-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .entry-actions button { padding: 4px 9px; font-size: 0.9rem; }

  #emptyState { text-align: center; color: var(--muted); padding: 48px 0; display: none; line-height: 1.8; }
  #emptyState .empty-icon { font-size: 2rem; }

  /* Calendar */
  #calendarSection {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  #calPrevBtn, #calNextBtn { font-size: 1.2rem; line-height: 1; padding: 6px 14px; }
  .cal-jump { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .cal-jump select {
    font: inherit;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
    border-radius: 8px;
    padding: 6px 8px;
    cursor: pointer;
  }
  .cal-jump select:hover { border-color: var(--accent); }
  #calTodayBtn { font-size: 0.85rem; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow { font-size: 0.7rem; font-weight: 700; color: var(--muted); text-align: center; padding-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .cal-day {
    --tile-color: var(--accent);
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px;
    font-size: 0.8rem;
    position: relative;
    overflow: hidden;
    padding: 0;
  }
  .cal-day.has-entry {
    background: color-mix(in srgb, var(--tile-color) 16%, var(--card-bg));
    border-color: color-mix(in srgb, var(--tile-color) 45%, var(--border));
    font-weight: 600;
  }
  .cal-day.today { border-color: var(--accent); border-width: 2px; }
  .cal-day.selected { box-shadow: inset 0 0 0 2px var(--accent); }
  .cal-day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tile-color); position: relative; z-index: 1; }
  .cal-mood { font-size: 1.1rem; line-height: 1; position: relative; z-index: 1; }
  .cal-day-photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  .cal-day-num { position: relative; z-index: 1; }
  .cal-day.has-photo .cal-day-num {
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .cal-day.has-photo .cal-mood {
    position: absolute; right: 3px; bottom: 3px;
    font-size: 0.85rem;
    background: rgba(255, 255, 255, 0.88);
    border-radius: 50%;
    padding: 2px;
  }

  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); border-radius: 20px;
    padding: 4px 10px; font-size: 0.8rem; color: var(--text); margin-bottom: 14px;
  }
  .filter-chip button { border: none; background: none; padding: 0; color: var(--accent); font-size: 0.85rem; font-weight: 600; min-height: 0; }

  /* Modals */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; background: var(--overlay);
    align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .modal {
    background:
      linear-gradient(90deg, var(--accent), var(--accent-2)) top / 100% 5px no-repeat,
      var(--card-bg);
    border-radius: 14px;
    padding: 22px 20px 18px;
    width: 100%; max-width: 580px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }
  .modal h2 { margin: 0 0 14px; font-size: 1.1rem; }

  .viewer-header { display: flex; align-items: flex-start; gap: 12px; }
  .viewer-mood { font-size: 2.1rem; line-height: 1; }
  .viewer-heading { flex: 1; min-width: 0; }
  .viewer-heading h2 { margin: 0 0 2px; }
  .viewer-date { font-size: 0.8rem; color: var(--muted); }
  .viewer-header-actions { display: flex; gap: 6px; flex-shrink: 0; }
  #viewerChips:empty { display: none; }
  .viewer-body { white-space: pre-wrap; line-height: 1.6; margin: 16px 0; }
  #viewerPhotos:empty { display: none; }

  .field { margin-bottom: 14px; }
  .field > label, .field-label { font-size: 0.75rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
  }
  .field textarea { resize: vertical; min-height: 140px; line-height: 1.5; }
  .field-row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; }

  .mood-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
  button.mood-btn {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 7px 4px;
    border-radius: 10px;
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--card-bg);
  }
  button.mood-btn .me { font-size: 1.35rem; line-height: 1.15; }
  button.mood-btn:hover { border-color: var(--mood-color); }
  button.mood-btn.selected {
    background: color-mix(in srgb, var(--mood-color) 18%, var(--card-bg));
    border-color: var(--mood-color);
    box-shadow: inset 0 0 0 1px var(--mood-color);
    color: var(--text);
    font-weight: 600;
  }

  .weather-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .weather-display { flex: 1; min-width: 160px; font-size: 0.85rem; color: var(--muted); }
  .weather-note { font-size: 0.75rem; color: var(--muted); margin-top: 5px; }
  .weather-note:empty { display: none; }

  .photo-drop {
    border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--border));
    border-radius: 10px;
    padding: 10px;
    background: color-mix(in srgb, var(--accent) 4%, var(--card-bg));
  }
  .photo-drop.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .photo-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .photo-thumbs:empty { margin-bottom: 0; }
  .photo-thumb-wrap { position: relative; }
  .photo-thumb-wrap img.thumb { display: block; }
  button.thumb-remove {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; min-height: 0; border-radius: 50%;
    background: var(--danger); color: #fff; border: none; padding: 0;
    line-height: 1; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  .location-row { display: flex; gap: 8px; }
  .location-row input { flex: 1; }
  .location-row button { white-space: nowrap; }
  .location-meta {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 0.78rem; color: var(--muted); margin-top: 6px;
  }
  .location-meta:empty { display: none; }
  .location-meta a { color: var(--accent); }
  .location-meta button { padding: 2px 8px; font-size: 0.75rem; min-height: 0; }
  .location-hint { font-size: 0.75rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .location-hint code {
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-size: 0.75rem;
  }

  #lightbox {
    display: none;
    position: fixed; inset: 0; background: var(--overlay);
    align-items: center; justify-content: center; z-index: 200; flex-direction: column;
  }
  #lightbox img { max-width: 92vw; max-height: 78vh; object-fit: contain; border-radius: 6px; }
  .lightbox-controls { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
  .lightbox-controls button { background: rgba(255, 255, 255, 0.15); color: #fff; border: none; padding: 8px 14px; }
  #lightboxCounter { color: #fff; font-size: 0.85rem; }
  #lightboxClose { position: absolute; top: 16px; right: 20px; background: rgba(255, 255, 255, 0.15); color: #fff; border: none; }

  @media (pointer: coarse) {
    button { padding: 10px 16px; min-height: 40px; }
    .entry-actions button, .view-toggle button { padding: 8px 12px; }
    button.mood-btn { padding: 8px 4px; }
    input, textarea, select { font-size: 16px; }
  }
  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    .brand { order: 1; }
    .theme-wrap { order: 2; }
    #fileControls { order: 3; width: 100%; justify-content: space-between; }
    main { padding: 12px; }
    .entry-card { flex-wrap: wrap; }
    .entry-main { flex: 1 1 0; }
    .entry-actions { width: 100%; justify-content: flex-end; }
    .field-row { grid-template-columns: 1fr; gap: 0; }
    .viewer-header { flex-wrap: wrap; }
    .viewer-header-actions { order: -1; width: 100%; justify-content: flex-end; }
    .location-row { flex-wrap: wrap; }
    .location-row button { flex: 1; }

</style>
</head>

<script>
(() => {
  let data = { entries: [] };
  let dirHandle = null;
  let photosDirHandle = null;
  let dataFileHandle = null;

  let view = 'timeline';
  let calendarMonth = new Date();
  let dateFilter = null;

  let draft = null;
  let sessionAddedPhotos = [];
  let pendingDeletes = [];

  let lightboxPhotos = [];
  let lightboxIndex = 0;

  const photoUrlCache = new Map();

  const el = id => document.getElementById(id);

  const MOODS = {
    happy:    { emoji: '😊', label: 'Happy',    color: '#f2b418' },
    excited:  { emoji: '🤩', label: 'Excited',  color: '#ff7a1a' },
    loved:    { emoji: '🥰', label: 'Loved',    color: '#ec5f9b' },
    grateful: { emoji: '🙏', label: 'Grateful', color: '#19a7a0' },
    relieved: { emoji: '😌', label: 'Relieved', color: '#3dbb6b' },
    hopeful:  { emoji: '🤞', label: 'Hopeful',  color: '#7ac142' },
    proud:    { emoji: '😎', label: 'Proud',    color: '#2b9bd6' },
    neutral:  { emoji: '😐', label: 'Neutral',  color: '#9aa0aa' },
    tired:    { emoji: '😴', label: 'Tired',    color: '#6b7bd9' },
    confused: { emoji: '😕', label: 'Confused', color: '#a06cd5' },
    anxious:  { emoji: '😰', label: 'Anxious',  color: '#e0952e' },
    stressed: { emoji: '😫', label: 'Stressed', color: '#d9713a' },
    sad:      { emoji: '😢', label: 'Sad',      color: '#3b82d9' },
    angry:    { emoji: '😠', label: 'Angry',    color: '#e04848' },
    sick:     { emoji: '🤒', label: 'Sick',     color: '#8ea83a' },
  };

  const THEMES = {
    ocean:    { name: 'Ocean',    swatch: ['#2667c9', '#129e94'] },
    sunset:   { name: 'Sunset',   swatch: ['#d9482f', '#e57c2f'] },
    forest:   { name: 'Forest',   swatch: ['#2a7f4d', '#5f9a2e'] },
    lavender: { name: 'Lavender', swatch: ['#6d4fd6', '#c9458a'] },
    classic:  { name: 'Classic',  swatch: ['#3b6ef6', '#5b7ff5'] },
  };

  // WMO weather codes used by Open-Meteo: [codes, day emoji, night emoji, label, extra search words]
  const WEATHER_CODES = [
    [[0], '☀️', '🌙', 'Clear', 'sunny sun clear'],
    [[1], '🌤️', '🌙', 'Mostly clear', 'sunny sun clear'],
    [[2], '⛅', '☁️', 'Partly cloudy', 'cloudy clouds sun'],
    [[3], '☁️', '☁️', 'Overcast', 'cloudy clouds gray grey'],
    [[45, 48], '🌫️', '🌫️', 'Fog', 'foggy mist'],
    [[51, 53, 55], '🌦️', '🌧️', 'Drizzle', 'rain rainy wet'],
    [[56, 57], '🌧️', '🌧️', 'Freezing drizzle', 'rain ice icy freezing'],
    [[61], '🌧️', '🌧️', 'Light rain', 'rain rainy wet'],
    [[63], '🌧️', '🌧️', 'Rain', 'rain rainy wet'],
    [[65], '🌧️', '🌧️', 'Heavy rain', 'rain rainy wet storm'],
    [[66, 67], '🌧️', '🌧️', 'Freezing rain', 'rain ice icy freezing'],
    [[71], '🌨️', '🌨️', 'Light snow', 'snow snowy'],
    [[73], '🌨️', '🌨️', 'Snow', 'snow snowy'],
    [[75], '❄️', '❄️', 'Heavy snow', 'snow snowy blizzard'],
    [[77], '🌨️', '🌨️', 'Snow grains', 'snow snowy'],
    [[80, 81], '🌦️', '🌧️', 'Rain showers', 'rain rainy showers wet'],
    [[82], '⛈️', '⛈️', 'Heavy showers', 'rain rainy showers storm'],
    [[85, 86], '🌨️', '🌨️', 'Snow showers', 'snow snowy'],
    [[95], '⛈️', '⛈️', 'Thunderstorm', 'storm thunder lightning rain'],
    [[96, 99], '⛈️', '⛈️', 'Thunderstorm with hail', 'storm thunder lightning hail'],
  ];

  const US_STATES = {
    alabama: 'al', alaska: 'ak', arizona: 'az', arkansas: 'ar', california: 'ca', colorado: 'co',
    connecticut: 'ct', delaware: 'de', florida: 'fl', georgia: 'ga', hawaii: 'hi', idaho: 'id',
    illinois: 'il', indiana: 'in', iowa: 'ia', kansas: 'ks', kentucky: 'ky', louisiana: 'la',
    maine: 'me', maryland: 'md', massachusetts: 'ma', michigan: 'mi', minnesota: 'mn',
    mississippi: 'ms', missouri: 'mo', montana: 'mt', nebraska: 'ne', nevada: 'nv',
    'new hampshire': 'nh', 'new jersey': 'nj', 'new mexico': 'nm', 'new york': 'ny',
    'north carolina': 'nc', 'north dakota': 'nd', ohio: 'oh', oklahoma: 'ok', oregon: 'or',
    pennsylvania: 'pa', 'rhode island': 'ri', 'south carolina': 'sc', 'south dakota': 'sd',
    tennessee: 'tn', texas: 'tx', utah: 'ut', vermont: 'vt', virginia: 'va', washington: 'wa',
    'west virginia': 'wv', wisconsin: 'wi', wyoming: 'wy', 'district of columbia': 'dc',
  };

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function formatDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parseLocalDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  // ---------- Theme ----------
  function applyTheme(key) {
    if (!THEMES[key]) key = 'ocean';
    document.documentElement.dataset.theme = key;
    el('themeColorMeta').setAttribute('content', THEMES[key].swatch[0]);
    try { localStorage.setItem('personal-journal-theme', key); } catch (e) { /* storage unavailable */ }
  }

  function renderThemeMenu() {
    const current = document.documentElement.dataset.theme;
    el('themeMenu').innerHTML = '<div class="theme-menu-title">Color theme</div>' + Object.entries(THEMES).map(([key, t]) => `
      <button type="button" class="theme-option${key === current ? ' active' : ''}" data-theme-key="${key}">
        <span class="swatch" style="background: linear-gradient(135deg, ${t.swatch[0]}, ${t.swatch[1]})"></span>
        <span>${t.name}${key === current ? ' ✓' : ''}</span>
      </button>`).join('');
  }

  function closeThemeMenu() {
    el('themeMenu').hidden = true;
    el('themeBtn').setAttribute('aria-expanded', 'false');
  }

  el('themeBtn').addEventListener('click', e => {
    e.stopPropagation();
    const opening = el('themeMenu').hidden;
    if (opening) renderThemeMenu();
    el('themeMenu').hidden = !opening;
    el('themeBtn').setAttribute('aria-expanded', String(opening));
  });
  el('themeMenu').addEventListener('click', e => {
    const opt = e.target.closest('.theme-option');
    if (!opt) return;
    applyTheme(opt.dataset.themeKey);
    renderThemeMenu();
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.theme-wrap')) closeThemeMenu();
  });

  // ---------- IndexedDB handle persistence ----------
  function idbOpen() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('personal-journal', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, val) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  // ---------- Persistence ----------
  async function loadFromLocalStorage() {
    try {
      const raw = localStorage.getItem('personal-journal-data');
      if (raw) data = JSON.parse(raw);
    } catch (e) { console.error(e); }
  }
  function saveToLocalStorage() {
    try {
      localStorage.setItem('personal-journal-data', JSON.stringify(data));
    } catch (e) { console.error('Could not save to localStorage', e); }
  }
  async function saveData() {
    if (dataFileHandle) {
      try {
        const writable = await dataFileHandle.createWritable();
        await writable.write(JSON.stringify(data, null, 2));
        await writable.close();
        return;
      } catch (e) {
        console.error('Failed writing file, falling back to localStorage', e);
      }
    }
    saveToLocalStorage();
  }
  async function loadFromFile() {
    const file = await dataFileHandle.getFile();
    const text = await file.text();
    if (text.trim()) {
      data = JSON.parse(text);
    } else {
      data = { entries: [] };
      await saveData();
    }
  }

  async function verifyPermission(handle) {
    const opts = { mode: 'readwrite' };
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    if ((await handle.requestPermission(opts)) === 'granted') return true;
    return false;
  }

  async function connectHandles() {
    photosDirHandle = await dirHandle.getDirectoryHandle('photos', { create: true });
    dataFileHandle = await dirHandle.getFileHandle('journal-data.json', { create: true });
  }

  async function chooseFolder() {
    if (!('showDirectoryPicker' in window)) {
      alert('This browser can\'t connect a folder — Firefox and Safari don\'t support that feature yet (only Chrome, Edge, and other Chromium browsers do). Your entries will still save in this browser\'s local storage, but won\'t sync to your Drive folder unless you use Chrome or Edge.');
      return;
    }
    try {
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      if (!(await verifyPermission(handle))) throw new Error('Permission denied');
      dirHandle = handle;
      await connectHandles();
      await idbSet('dirHandle', dirHandle);
      await loadFromFile();
      updateFileStatus();
      renderCurrentView();
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    }
  }

  async function tryRestoreDir() {
    if (!('showDirectoryPicker' in window)) { updateFileStatus(); return; }
    try {
      const handle = await idbGet('dirHandle');
      if (!handle) return;
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        dirHandle = handle;
        updateFileStatus('needsPermission');
        return;
      }
      dirHandle = handle;
      await connectHandles();
      await loadFromFile();
    } catch (e) {
      console.error('Could not restore folder handle', e);
    }
  }

  function updateFileStatus(state) {
    const status = el('fileStatus');
    const banner = el('banner');
    const connectBtn = el('connectBtn');
    if (dirHandle && state !== 'needsPermission') {
      status.textContent = 'Connected: ' + (dirHandle.name || 'journal folder');
      banner.style.display = 'none';
      connectBtn.textContent = 'Switch folder';
    } else if (state === 'needsPermission') {
      status.textContent = 'Click "Reconnect" to grant access to your journal folder';
      connectBtn.textContent = 'Reconnect';
      banner.style.display = 'none';
    } else {
      status.textContent = 'showDirectoryPicker' in window
        ? 'Not connected — using local browser storage'
        : 'Folder access unsupported in this browser — using local browser storage';
      banner.style.display = 'block';
      connectBtn.textContent = 'Connect journal folder';
    }
  }

  el('connectBtn').addEventListener('click', async () => {
    if (dirHandle && (await dirHandle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
      if (await verifyPermission(dirHandle)) {
        await connectHandles();
        await loadFromFile();
        updateFileStatus();
        renderCurrentView();
        return;
      }
    }
    chooseFolder();
  });

  // ---------- Photo helpers ----------
  async function resolvePhotoUrl(path) {
    if (!path) return '';
    if (path.startsWith('data:')) return path;
    if (photoUrlCache.has(path)) return photoUrlCache.get(path);
    if (!photosDirHandle) return '';
    try {
      const name = path.split('/').pop();
      const fh = await photosDirHandle.getFileHandle(name);
      const file = await fh.getFile();
      const url = URL.createObjectURL(file);
      photoUrlCache.set(path, url);
      return url;
    } catch (e) {
      console.error('Could not load photo', path, e);
      return '';
    }
  }

  function resolveImagesIn(container) {
    container.querySelectorAll('img[data-photo]').forEach(img => {
      resolvePhotoUrl(img.dataset.photo).then(url => { if (url) img.src = url; });
    });
  }

  async function deletePhotoFile(path) {
    if (photosDirHandle && !path.startsWith('data:')) {
      try { await photosDirHandle.removeEntry(path.split('/').pop()); } catch (e) { /* already gone */ }
    }
    const cached = photoUrlCache.get(path);
    if (cached) URL.revokeObjectURL(cached);
    photoUrlCache.delete(path);
  }

  async function handleNewPhotos(fileList) {
    const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    for (const file of files) {
      const ext = ((file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '')) || 'jpg';
      const rand = uuid().slice(0, 8);
      if (photosDirHandle) {
        const name = `${draft.date}-${rand}.${ext}`;
        try {
          const fh = await photosDirHandle.getFileHandle(name, { create: true });
          const writable = await fh.createWritable();
          await writable.write(file);
          await writable.close();
          const path = 'photos/' + name;
          draft.photos.push(path);
          sessionAddedPhotos.push(path);
          photoUrlCache.set(path, URL.createObjectURL(file));
        } catch (e) { console.error('Failed to save photo', e); }
      } else {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        draft.photos.push(dataUrl);
        sessionAddedPhotos.push(dataUrl);
      }
    }
    renderEditorPhotos();
  }

  function removeDraftPhoto(path) {
    draft.photos = draft.photos.filter(p => p !== path);
    if (!pendingDeletes.includes(path)) pendingDeletes.push(path);
    renderEditorPhotos();
  }

  // ---------- Shared entry display ----------
  function locationText(loc) {
    if (!loc) return '';
    if (loc.label) return loc.label;
    if (loc.lat != null) return `${loc.lat.toFixed(3)}, ${loc.lng.toFixed(3)}`;
    return '';
  }

  function chipsHtml(entry) {
    const items = chipItemsHtml(entry);
    return items ? `<div class="chips">${items}</div>` : '';
  }

  function chipItemsHtml(entry) {
    const parts = [];
    const mood = MOODS[entry.mood];
    if (mood) {
      parts.push(`<span class="chip mood" style="--chip-color:${mood.color}">${mood.emoji} ${mood.label}</span>`);
    }
    if (entry.weather) {
      parts.push(`<span class="chip weather">${escapeHtml(weatherText(entry.weather))}</span>`);
    }
    const locLabel = locationText(entry.location);
    if (locLabel) {
      const url = mapsUrlFor(entry.location);
      parts.push(url
        ? `<a class="chip loc-pill" href="${url}" target="_blank" rel="noopener noreferrer">📍 ${escapeHtml(locLabel)}</a>`
        : `<span class="chip">📍 ${escapeHtml(locLabel)}</span>`);
    }
    return parts.join('');
  }

  // ---------- Editor ----------
  function blankEntry(dateStr) {
    return {
      id: uuid(),
      date: dateStr || formatDate(new Date()),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      title: '',
      body: '',
      photos: [],
      location: null,
      mood: null,
      weather: null,
    };
  }

  function openEditor(entry) {
    draft = entry ? JSON.parse(JSON.stringify(entry)) : blankEntry();
    if (draft.mood === undefined) draft.mood = null;
    if (draft.weather === undefined) draft.weather = null;
    sessionAddedPhotos = [];
    pendingDeletes = [];
    const isExisting = !!entry && data.entries.some(x => x.id === entry.id);
    el('editorHeading').textContent = isExisting ? 'Edit entry' : 'New entry';
    el('editorDate').value = draft.date;
    el('editorTitle').value = draft.title || '';
    el('editorBody').value = draft.body || '';
    el('locationLabelInput').value = draft.location?.label || '';
    renderMoodPicker();
    renderEditorPhotos();
    renderLocationMeta();
    renderWeatherMeta();
    el('editorModal').style.display = 'flex';
    el('editorTitle').focus();
  }

  // ---------- Mood ----------
  function renderMoodPicker() {
    el('moodPicker').innerHTML = Object.entries(MOODS).map(([key, m]) => `
      <button type="button" class="mood-btn${draft.mood === key ? ' selected' : ''}" data-mood="${key}"
        style="--mood-color:${m.color}" aria-pressed="${draft.mood === key}" aria-label="${m.label}">
        <span class="me" aria-hidden="true">${m.emoji}</span><span>${m.label}</span>
      </button>`).join('');
  }

  el('moodPicker').addEventListener('click', e => {
    const btn = e.target.closest('.mood-btn');
    if (!btn || !draft) return;
    draft.mood = draft.mood === btn.dataset.mood ? null : btn.dataset.mood;
    renderMoodPicker();
  });

  // ---------- Location ----------
  function mapsUrlFor(location) {
    if (!location) return null;
    if (location.lat != null && location.lng != null) {
      return `https://www.google.com/maps?q=${location.lat},${location.lng}`;
    }
    if (location.label) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location.label)}`;
    }
    return null;
  }

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&addressdetails=1`, {
        headers: { 'Accept': 'application/json' },
      });
      if (!res.ok) throw new Error('reverse geocode request failed');
      const result = await res.json();
      const a = result.address || {};
      const place = a.city || a.town || a.village || a.hamlet || a.suburb || a.county;
      const region = a.state && a.state !== place ? a.state : null;
      const short = [place, region, a.country].filter(Boolean).join(', ');
      return short || result.display_name || null;
    } catch (e) {
      console.error('Reverse geocode failed', e);
      return null;
    }
  }

  async function forwardGeocode(query) {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`, {
      headers: { 'Accept': 'application/json' },
    });
    if (!res.ok) throw new Error('place lookup failed');
    const results = await res.json();
    return results[0] ? { lat: Number(results[0].lat), lng: Number(results[0].lon) } : null;
  }

  function renderLocationMeta() {
    const box = el('locationMeta');
    if (!draft.location || (!draft.location.label && draft.location.lat == null)) {
      box.innerHTML = '';
      return;
    }
    const url = mapsUrlFor(draft.location);
    const coordsText = draft.location.lat != null ? `${draft.location.lat.toFixed(4)}, ${draft.location.lng.toFixed(4)}` : '';
    box.innerHTML = `
      ${coordsText ? `<span>${coordsText}</span>` : ''}
      ${url ? `<a href="${url}" target="_blank" rel="noopener noreferrer">Open in Maps ↗</a>` : ''}
      <button type="button" id="clearLocationBtn">Clear</button>
    `;
  }

  el('locationMeta').addEventListener('click', e => {
    if (e.target.id === 'clearLocationBtn') {
      draft.location = null;
      el('locationLabelInput').value = '';
      renderLocationMeta();
    }
  });

  el('locationLabelInput').addEventListener('input', () => {
    const val = el('locationLabelInput').value;
    if (!draft.location) draft.location = { lat: null, lng: null, label: '' };
    draft.location.label = val;
    renderLocationMeta();
  });

  // Gets GPS coordinates, looks up a place name, and stores both on the draft.
  function captureCurrentLocation() {
    return new Promise((resolve, reject) => {
      if (!('geolocation' in navigator)) {
        reject(new Error('Geolocation is not available in this browser.'));
        return;
      }
      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const name = await reverseGeocode(lat, lng);
        if (!draft) { reject(new Error('Editor was closed.')); return; }
        draft.location = { lat, lng, label: name || `${lat.toFixed(4)}, ${lng.toFixed(4)}` };
        el('locationLabelInput').value = draft.location.label;
        renderLocationMeta();
        resolve(draft.location);
      }, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    });
  }

  function isGeolocationError(err) {
    return err && typeof err.code === 'number' && 'PERMISSION_DENIED' in err;
  }

  const HOSTED_URL = 'https://robvasquezjr-droid.github.io/personal-journal/';
  const isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  // Opened from a file (file://, or content:// from the Drive/Files app) rather than a web address.
  const openedFromFile = !/^https?:$/.test(location.protocol);

  function openedFromFileAdvice() {
    return isPhone
      ? `Location can't work when the journal is opened from a file on your phone. Open ${HOSTED_URL} in Chrome instead (bookmark it or add it to your home screen).`
      : `Chrome blocks location on files opened straight from disk. Double-click start-journal.bat in the journal folder, or open ${HOSTED_URL} instead.`;
  }

  // Chrome reports every refusal as "User denied Geolocation"; work out which kind it was.
  async function geolocationErrorMessage(err) {
    const manual = ' You can still type a location manually.';
    if (err.code === err.TIMEOUT) {
      return 'Finding your location took too long. Check that location is turned on for your device, then try again.' + manual;
    }
    if (err.code !== err.PERMISSION_DENIED) {
      return 'Could not get your location (' + err.message + '). Check that location is turned on for your device.' + manual;
    }
    if (openedFromFile) return openedFromFileAdvice() + manual;

    let state = 'unknown';
    try { state = (await navigator.permissions.query({ name: 'geolocation' })).state; } catch (e) { /* not supported */ }
    if (state === 'denied') {
      return 'Chrome has location blocked for this site. To fix it: tap the icon just left of the web address → Permissions (or Site settings) → Location → Allow, then reload the page.' + manual;
    }
    return 'Location was refused before Chrome could ask you. Check that your phone lets Chrome use location (phone Settings → Apps → Chrome → Permissions → Location → "Allow only while using the app") and that location is turned on. If you closed Chrome\'s location prompt a few times, Chrome may block it for a while — tap the icon left of the web address → Permissions → Location → Allow.' + manual;
  }

  el('useLocationBtn').addEventListener('click', async () => {
    const btn = el('useLocationBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Locating…';
    try {
      await captureCurrentLocation();
      // "Current location" on today's entry is a natural moment to grab current weather too.
      if (draft && !draft.weather && el('editorDate').value === formatDate(new Date())) {
        await addWeather({ quiet: true });
      }
    } catch (err) {
      console.error('Geolocation error', err);
      alert(isGeolocationError(err) ? await geolocationErrorMessage(err) : err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  });

  // ---------- Weather ----------
  function weatherInfo(code, isDay = true) {
    const match = WEATHER_CODES.find(([codes]) => codes.includes(code));
    if (!match) return { emoji: '🌡️', label: 'Weather', words: '' };
    const [, dayEmoji, nightEmoji, label, words] = match;
    return { emoji: isDay ? dayEmoji : nightEmoji, label, words };
  }

  function weatherText(w) {
    const info = weatherInfo(w.code, w.isDay !== false);
    const temps = w.kind === 'current' ? `${w.temp}°F` : `${w.high}° / ${w.low}°F`;
    return `${info.emoji} ${temps} · ${w.summary || info.label}`;
  }

  function weatherSearchWords(w) {
    const info = weatherInfo(w.code);
    const temp = w.kind === 'current' ? w.temp : w.high;
    const feel = temp >= 85 ? 'hot' : temp <= 32 ? 'freezing cold' : temp <= 45 ? 'cold' : '';
    return [w.summary || info.label, info.words, feel].join(' ');
  }

  async function fetchJson(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`weather service returned ${res.status}`);
    return res.json();
  }

  // Current conditions for today; that day's high/low for past dates.
  async function fetchWeather(dateStr, lat, lng) {
    const base = {
      latitude: lat.toFixed(4),
      longitude: lng.toFixed(4),
      temperature_unit: 'fahrenheit',
      timezone: 'auto',
    };
    if (dateStr === formatDate(new Date())) {
      const params = new URLSearchParams({ ...base, current: 'temperature_2m,weather_code,is_day' });
      const result = await fetchJson(`https://api.open-meteo.com/v1/forecast?${params}`);
      const c = result.current;
      return {
        kind: 'current',
        date: dateStr,
        code: c.weather_code,
        temp: Math.round(c.temperature_2m),
        isDay: c.is_day === 1,
        summary: weatherInfo(c.weather_code).label,
      };
    }
    const params = new URLSearchParams({
      ...base,
      daily: 'weather_code,temperature_2m_max,temperature_2m_min',
      start_date: dateStr,
      end_date: dateStr,
    });
    let result;
    try {
      // Recent past days are served by the forecast API...
      result = await fetchJson(`https://api.open-meteo.com/v1/forecast?${params}`);
    } catch (e) {
      // ...older dates come from the historical archive.
      result = await fetchJson(`https://archive-api.open-meteo.com/v1/archive?${params}`);
    }
    const d = result.daily;
    if (!d || d.weather_code[0] == null) throw new Error('no weather data for that date yet');
    return {
      kind: 'daily',
      date: dateStr,
      code: d.weather_code[0],
      high: Math.round(d.temperature_2m_max[0]),
      low: Math.round(d.temperature_2m_min[0]),
      summary: weatherInfo(d.weather_code[0]).label,
    };
  }

  async function addWeather({ quiet = false } = {}) {
    const dateStr = el('editorDate').value || formatDate(new Date());
    if (dateStr > formatDate(new Date())) {
      if (!quiet) alert('Weather can only be added for today or past dates.');
      return;
    }
    const btn = el('weatherBtn');
    btn.disabled = true;
    el('weatherDisplay').textContent = 'Checking the weather…';
    try {
      let loc = draft.location;
      if (!loc || (loc.lat == null && !loc.label)) {
        loc = await captureCurrentLocation();
      } else if (loc.lat == null) {
        const hit = await forwardGeocode(loc.label);
        if (!hit) throw new Error(`couldn't find "${loc.label}" on the map — try a city name`);
        loc.lat = hit.lat;
        loc.lng = hit.lng;
        renderLocationMeta();
      }
      const weather = await fetchWeather(dateStr, loc.lat, loc.lng);
      if (draft) draft.weather = weather;
    } catch (err) {
      console.error('Weather lookup failed', err);
      if (!quiet) {
        alert(isGeolocationError(err)
          ? await geolocationErrorMessage(err) + '\n\nWeather needs a location — add one above, then try again.'
          : 'Could not get the weather: ' + err.message);
      }
    } finally {
      btn.disabled = false;
      if (draft) renderWeatherMeta();
    }
  }

  function renderWeatherMeta() {
    const display = el('weatherDisplay');
    const note = el('weatherNote');
    const w = draft.weather;
    if (!w) {
      display.textContent = 'No weather added';
      el('weatherBtn').textContent = '🌤️ Add weather';
      el('clearWeatherBtn').style.display = 'none';
      note.textContent = '';
      return;
    }
    display.innerHTML = `<span class="chip weather">${escapeHtml(weatherText(w))}</span>`;
    el('weatherBtn').textContent = '↻ Refresh';
    el('clearWeatherBtn').style.display = '';
    const entryDate = el('editorDate').value;
    if (w.date && entryDate && w.date !== entryDate) {
      const when = parseLocalDate(w.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      note.textContent = `This weather is for ${when}. Tap Refresh to get it for this entry's date.`;
    } else {
      note.textContent = w.kind === 'current' ? 'Conditions when you added it.' : "That day's high / low.";
    }
  }

  el('weatherBtn').addEventListener('click', () => addWeather());
  el('clearWeatherBtn').addEventListener('click', () => {

  // ---------- Views ----------
  function setView(next) {

  el('viewCalendarBtn').addEventListener('click', () => { setView('calendar'); renderCurrentView(); });

  function onSearchChanged() {
    if (el('searchInput').value.trim() && view !== 'timeline') setView('timeline');
    renderCurrentView();

  el('searchInput').addEventListener('input', onSearchChanged);
  el('searchScope').addEventListener('change', onSearchChanged);

  el('clearDateFilter').addEventListener('click', () => {
    dateFilter = null;
    renderCurrentView();
  });

  // ---------- Search ----------
  function normalizeText(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function words(s) {
    return normalizeText(s).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  }

  // Extra words so "MI", "USA", etc. find places stored by their full names.
  function placeAliases(label) {
    const n = normalizeText(label);
    const extra = [];
    for (const [name, abbr] of Object.entries(US_STATES)) {
      if (new RegExp(`\\b${name}\\b`).test(n)) extra.push(abbr);
    }
    if (n.includes('united states')) extra.push('usa', 'us', 'america');
    if (n.includes('united kingdom')) extra.push('uk', 'britain');
    return extra.join(' ');
  }

  function searchableWords(entry, scope) {
    const parts = [];
    const all = scope === 'all';
    if (all || scope === 'text') parts.push(entry.title, entry.body);
    if ((all || scope === 'places') && entry.location && entry.location.label) {
      parts.push(entry.location.label, placeAliases(entry.location.label));
    }
    if ((all || scope === 'mood') && MOODS[entry.mood]) parts.push(MOODS[entry.mood].label);
    if ((all || scope === 'weather') && entry.weather) parts.push(weatherSearchWords(entry.weather));
    if (all) {
      const d = parseLocalDate(entry.date);
      parts.push(d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }), entry.date);
    }
    return words(parts.join(' '));
  }

  // Every search word must match the start of some word in the entry.
  function matchesSearch(entry, terms, scope) {
    const entryWords = searchableWords(entry, scope);
    return terms.every(term => entryWords.some(w => w.startsWith(term)));
  }

  function getFilteredSortedEntries() {
    const terms = words(el('searchInput').value);
    const scope = el('searchScope').value;
    let list = [...data.entries];
    if (terms.length) list = list.filter(e => matchesSearch(e, terms, scope));
    if (dateFilter) list = list.filter(e => e.date === dateFilter);
    list.sort((a, b) => b.date.localeCompare(a.date) || new Date(b.createdAt) - new Date(a.createdAt));
    return list;
  }

  function renderSearchStatus(shownCount) {
    const status = el('searchStatus');
    const query = el('searchInput').value.trim();
    if (!query) { status.hidden = true; return; }
    const scope = el('searchScope').value;
    const scopeText = { all: 'everywhere', text: 'in entry text', places: 'in places', mood: 'in moods', weather: 'in weather' }[scope];
    status.hidden = false;
    status.innerHTML = `<strong>${shownCount}</strong> of ${data.entries.length} entries match “${escapeHtml(query)}” ${scopeText}`;
  }

  function renderDateFilterChip() {
    const chip = el('dateFilterChip');
    if (dateFilter) {
      chip.style.display = 'inline-flex';
      el('dateFilterLabel').textContent = parseLocalDate(dateFilter).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    } else {
      chip.style.display = 'none';
    }
  }

  function renderTimeline() {
    renderDateFilterChip();
    const container = el('timelineList');
    container.innerHTML = '';
    const list = getFilteredSortedEntries();
    renderSearchStatus(list.length);

    const empty = el('emptyState');
    if (list.length) {
      empty.style.display = 'none';
    } else {
      empty.style.display = 'block';
      empty.innerHTML = data.entries.length
        ? '<div class="empty-icon">🔍</div>No entries match your search.'
        : '<div class="empty-icon">📔</div>No entries yet. Click “+ New entry” to write your first one.';
    }

    let lastMonthKey = null;
    list.forEach(entry => {
      const d = parseLocalDate(entry.date);
      const monthKey = d.getFullYear() + '-' + d.getMonth();
      if (monthKey !== lastMonthKey) {
        lastMonthKey = monthKey;
        const header = document.createElement('div');
        header.className = 'month-header';
        header.textContent = d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        container.appendChild(header);
      }

      const mood = MOODS[entry.mood];
      const snippet = entry.body || '';
      const card = document.createElement('div');
      card.className = 'entry-card';
      card.dataset.id = entry.id;
      if (mood) card.style.setProperty('--card-accent', mood.color);
      card.innerHTML = `
        <div class="date-badge">
          <span class="db-day">${d.getDate()}</span>
          <span class="db-wd">${d.toLocaleDateString(undefined, { weekday: 'short' })}</span>
        </div>
        <div class="entry-main">
          ${entry.title ? `<div class="entry-title">${escapeHtml(entry.title)}</div>` : ''}
          ${snippet ? `<div class="entry-snippet">${escapeHtml(snippet)}</div>` : ''}
          ${chipsHtml(entry)}
          ${entry.photos.length ? `<div class="thumb-strip">${
            entry.photos.slice(0, 4).map((p, i) => `<img class="thumb" data-photo="${p}" data-idx="${i}">`).join('')
          }${entry.photos.length > 4 ? `<div class="thumb-more">+${entry.photos.length - 4}</div>` : ''}</div>` : ''}
        </div>
        <div class="entry-actions">
          <button type="button" data-action="edit" title="Edit">✎</button>
          <button type="button" data-action="delete" class="danger" title="Delete">🗑</button>
        </div>
      `;
      container.appendChild(card);
    });
    resolveImagesIn(container);
  }

  el('timelineList').addEventListener('click', e => {
    const card = e.target.closest('.entry-card');
    if (!card) return;
    const entry = data.entries.find(x => x.id === card.dataset.id);
    if (!entry) return;

    const btn = e.target.closest('button[data-action]');
    if (btn) {
      e.stopPropagation();
      if (btn.dataset.action === 'edit') openEditor(entry);
      else if (btn.dataset.action === 'delete') deleteEntry(entry.id);
      return;
    }
    const locLink = e.target.closest('a.loc-pill');
    if (locLink) {
      e.stopPropagation();
      return;
    }
    const thumbImg = e.target.closest('img.thumb');
    if (thumbImg) {
      e.stopPropagation();
      openLightbox(entry.photos, Number(thumbImg.dataset.idx || 0));
      return;
    }
    openViewer(entry);
  });

  function renderCalendar() {
    const container = el('calendarGrid');
    container.innerHTML = '';
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    const entriesByDate = {};
    data.entries.forEach(e => { (entriesByDate[e.date] ||= []).push(e); });
    renderCalendarJump(year, month);

    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(dow => {
      const h = document.createElement('div');
      h.className = 'cal-dow';
      h.textContent = dow;
      container.appendChild(h);
    });

    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = formatDate(new Date());

    for (let i = 0; i < startOffset; i++) container.appendChild(document.createElement('div'));

    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = formatDate(new Date(year, month, day));
      const has = entriesByDate[dateStr];
      const coverPhoto = has ? has.map(e => e.photos[0]).find(Boolean) : null;
      const moodEntry = has ? has.find(e => MOODS[e.mood]) : null;
      const mood = moodEntry ? MOODS[moodEntry.mood] : null;
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-day'
        + (has ? ' has-entry' : '')
        + (dateStr === todayStr ? ' today' : '')
        + (dateStr === dateFilter ? ' selected' : '')
        + (coverPhoto ? ' has-photo' : '');
      cell.dataset.date = dateStr;
      const dayLabel = new Date(year, month, day).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      cell.setAttribute('aria-label', has
        ? `${dayLabel}, ${has.length} ${has.length === 1 ? 'entry' : 'entries'}${mood ? ', ' + mood.label : ''}`
        : `${dayLabel}, no entries`);
      if (mood) cell.style.setProperty('--tile-color', mood.color);
      cell.innerHTML = `
        ${coverPhoto ? `<img class="cal-day-photo" data-photo="${coverPhoto}">` : ''}
        <span class="cal-day-num">${day}</span>
        ${mood ? `<span class="cal-mood" title="${mood.label}">${mood.emoji}</span>` : (has && !coverPhoto ? '<div class="dot"></div>' : '')}
      `;
      container.appendChild(cell);
    }
    resolveImagesIn(container);
  }

  el('calendarGrid').addEventListener('click', e => {
    const cell = e.target.closest('.cal-day');
    if (!cell) return;
    const dateStr = cell.dataset.date;
    const entries = data.entries.filter(x => x.date === dateStr);
    if (entries.length === 1) {
      openViewer(entries[0]);
    } else if (entries.length > 1) {
      dateFilter = dateStr;
      setView('timeline');
      renderCurrentView();
    } else {
      openEditor(blankEntry(dateStr));
    }
  });

  // Month/year dropdowns, with entry counts so it's easy to spot where entries are.
  function renderCalendarJump(year, month) {
    const thisYear = new Date().getFullYear();
    const countsByYear = {};
    const countsByMonth = {};
    data.entries.forEach(e => {
      const y = Number(e.date.slice(0, 4));
      countsByYear[y] = (countsByYear[y] || 0) + 1;
      if (y === year) {
        const m = Number(e.date.slice(5, 7)) - 1;
        countsByMonth[m] = (countsByMonth[m] || 0) + 1;
      }
    });
    const entryYears = Object.keys(countsByYear).map(Number);
    const firstYear = Math.min(thisYear - 25, year, ...entryYears);
    const lastYear = Math.max(thisYear + 1, year, ...entryYears);

    const yearOptions = [];
    for (let y = lastYear; y >= firstYear; y--) {
      const n = countsByYear[y];
      yearOptions.push(`<option value="${y}">${y}${n ? ` (${n})` : ''}</option>`);
    }
    el('calYearSelect').innerHTML = yearOptions.join('');
    el('calYearSelect').value = String(year);

    el('calMonthSelect').innerHTML = Array.from({ length: 12 }, (_, m) => {
      const name = new Date(2000, m, 1).toLocaleDateString(undefined, { month: 'long' });
      const n = countsByMonth[m];
      return `<option value="${m}">${name}${n ? ` (${n})` : ''}</option>`;
    }).join('');
    el('calMonthSelect').value = String(month);

    const now = new Date();
    el('calTodayBtn').disabled = year === now.getFullYear() && month === now.getMonth();
  }

  function jumpCalendarTo(year, month) {
    calendarMonth = new Date(year, month, 1);
    renderCalendar();
  }

  el('calMonthSelect').addEventListener('change', () => {
    jumpCalendarTo(calendarMonth.getFullYear(), Number(el('calMonthSelect').value));
  });
  el('calYearSelect').addEventListener('change', () => {
    jumpCalendarTo(Number(el('calYearSelect').value), calendarMonth.getMonth());
  });
  el('calTodayBtn').addEventListener('click', () => {
    const now = new Date();
    jumpCalendarTo(now.getFullYear(), now.getMonth());
  });

  el('calPrevBtn').addEventListener('click', () => {
    calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1);
    renderCalendar();
  });
  el('calNextBtn').addEventListener('click', () => {
    calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1);
    renderCalendar();
  });

  function renderOnThisDay() {
    const box = el('onThisDay');
    const today = new Date();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    const thisYear = String(today.getFullYear());
    const matches = data.entries.filter(e => e.date.slice(5, 7) === mm && e.date.slice(8, 10) === dd && e.date.slice(0, 4) !== thisYear);
    matches.sort((a, b) => b.date.localeCompare(a.date));

    if (!matches.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.style.display = 'block';
    box.innerHTML = '<div class="otd-title">✨ On this day</div>' + matches.map(e => {
      const years = today.getFullYear() - Number(e.date.slice(0, 4));
      const label = e.title || (e.body || '').slice(0, 60) || 'Untitled entry';
      const mood = MOODS[e.mood];
      return `<button type="button" class="otd-item" data-id="${e.id}">${mood ? mood.emoji + ' ' : ''}${years} year${years === 1 ? '' : 's'} ago — ${escapeHtml(label)}</button>`;
    }).join('');
  }
  el('onThisDay').addEventListener('click', e => {
    const btn = e.target.closest('.otd-item');
    if (!btn) return;
    const entry = data.entries.find(x => x.id === btn.dataset.id);
    if (entry) openViewer(entry);
  });

  function renderCurrentView() {
    renderOnThisDay();
    if (view === 'timeline') {
      renderTimeline();
    } else {
      el('searchStatus').hidden = true;
      renderCalendar();
    }
  }

  // ---------- Init ----------
  applyTheme(document.documentElement.dataset.theme);
  el('headerDate').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  if (openedFromFile) {
    el('locationHint').textContent = openedFromFileAdvice() + ' You can still type a location above.';
    el('locationHint').style.display = 'block';
  }

  (async () => {
    await loadFromLocalStorage();
    await tryRestoreDir();
    updateFileStatus(dirHandle && (await dirHandle.queryPermission({ mode: 'readwrite' })) !== 'granted' ? 'needsPermission' : undefined);
    renderCurrentView();
  })();
})();
</script>
</body>
</html>
